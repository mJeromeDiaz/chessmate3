# Port 80 (docs/DEPLOY_VPS.md): Let's Encrypt's challenges, everything else sent to HTTPS.
# Installed by setup.sh, __DOMAIN__ replaced.
<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__ api.__DOMAIN__

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>
