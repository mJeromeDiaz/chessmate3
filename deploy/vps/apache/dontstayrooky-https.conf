# Port 443 (docs/DEPLOY_VPS.md): the SPA on www., the bare domain sent to www. (the API's only CORS
# origin), the API on api. through the PHP-FPM pool. One Let's Encrypt certificate for the three names.
# Installed by setup.sh (__DOMAIN__ and __ROOT__ replaced), enabled once the certificate exists.

SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off
SSLSessionTickets off
Protocols h2 http/1.1
ServerTokens Prod
ServerSignature Off

<VirtualHost *:443>
    ServerName www.__DOMAIN__
    DocumentRoot __ROOT__/app
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"

    # The build's .htaccess (front/public/.htaccess) sets the caching, security headers and wasm type.
    <Directory __ROOT__/app>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dontstayrooky-app-error.log
    CustomLog ${APACHE_LOG_DIR}/dontstayrooky-app-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    # The browser keeps the #route across the redirect.
    RedirectMatch 301 ^(.*)$ https://www.__DOMAIN__$1
</VirtualHost>

<VirtualHost *:443>
    ServerName api.__DOMAIN__
    DocumentRoot __ROOT__/api/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"

    # api/public/.htaccess routes to index.php and restores the Authorization header (the JWT).
    <Directory __ROOT__/api/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/dontstayrooky.sock|fcgi://dontstayrooky"
    </FilesMatch>
    # Slightly above PHP-FPM's request_terminate_timeout: PHP's own error comes first.
    ProxyTimeout 190

    ErrorLog ${APACHE_LOG_DIR}/dontstayrooky-api-error.log
    CustomLog ${APACHE_LOG_DIR}/dontstayrooky-api-access.log combined
</VirtualHost>
