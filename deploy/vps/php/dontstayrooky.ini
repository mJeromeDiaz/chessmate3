; PHP settings of the VPS (docs/DEPLOY_VPS.md), for PHP-FPM and the CLI.
; Installed by setup.sh as /etc/php/<version>/{fpm,cli}/conf.d/90-dontstayrooky.ini.
expose_php = Off
date.timezone = UTC

; Symfony's recommended production settings. Files are never re-checked: deploy.sh reloads
; PHP-FPM after each upload, which empties the cache.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
