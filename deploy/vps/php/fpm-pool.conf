; The API's PHP-FPM pool (docs/DEPLOY_VPS.md), run as the deploy user, who owns the code, var/ and
; .env.local. Sized for 4 GB of RAM shared with MySQL (1.5 GB buffer pool): about 60 MB per process.
; Installed by setup.sh as /etc/php/<version>/fpm/pool.d/dontstayrooky.conf (the default www pool is disabled).
[dontstayrooky]
user = __USER__
group = __USER__
listen = /run/php/dontstayrooky.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1000

request_terminate_timeout = 180
; Monolog writes errors to stderr in prod: kept in PHP-FPM's log (/var/log/php<version>-fpm.log).
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[memory_limit] = 256M
