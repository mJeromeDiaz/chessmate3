symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Reset links are valid for 30 minutes.
    lifetime: 1800
    # A new link can be requested for the same account 5 minutes after the previous one (on top of
    # the forgot_password_* rate limiters). Hitting this is silent: the response never changes.
    throttle_limit: 300
