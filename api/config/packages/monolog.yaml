monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Request traces (App\Security\Trace\RequestTraceListener, docs/SECURITY.md § 2.12): only
        # the "trace" handler writes them, every other handler excludes the channel.
        - trace

when@dev:
    monolog:
        handlers:
            # One JSON line per request, one file a day (var/log/traces/<env>-YYYY-MM-DD.log, UTC),
            # files older than 365 days deleted at the next rotation.
            trace: &trace_handler
                type: rotating_file
                path: "%kernel.logs_dir%/traces/%kernel.environment%.log"
                max_files: 365
                level: info
                channels: [trace]
                formatter: monolog.formatter.json
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!trace"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@e2e:
    monolog:
        handlers:
            trace: *trace_handler

when@test:
    monolog:
        handlers:
            # In memory (config/services.yaml, when@test): tests read what was traced.
            trace:
                type: service
                id: app.trace.test_handler
                channels: [trace]
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!trace"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            trace: *trace_handler
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!trace"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
