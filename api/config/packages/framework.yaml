# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            # Lichess public API (no token): puzzle rating import.
            lichess_api.client:
                base_uri: 'https://lichess.org'
                timeout: 5
                headers:
                    Accept: 'application/json'
                    User-Agent: '%app.lichess.user_agent%'
            # Lichess opening explorer (bearer token required, no scope): repertoire proxy
            # (App\Repertoire\Lichess). Its host is explorer.lichess.org, not lichess.org.
            lichess_explorer.client:
                base_uri: 'https://explorer.lichess.org'
                timeout: 5
                headers:
                    Accept: 'application/json'
                    User-Agent: '%app.lichess.user_agent%'
            # Lichess endgame tablebase (no token): checking the hand-written positions to evaluate
            # (App\Evaluation\Verification, docs/EVALUATION.md).
            lichess_tablebase.client:
                base_uri: 'https://tablebase.lichess.ovh'
                timeout: 5
                headers:
                    Accept: 'application/json'
                    User-Agent: '%app.lichess.user_agent%'

    # Expected third-party outages: warning, not the critical level of a 5xx.
    exceptions:
        App\State\Repertoire\LichessUnavailableHttpException:
            log_level: warning
        App\State\Puzzle\PuzzleMaintenanceHttpException:
            log_level: warning

    cache:
        pools:
            # Lichess explorer and cloud eval answers, shared by all users (public data), in MySQL
            # (no Redis): table repertoire_explorer_cache, expired rows purged by
            # `bin/console cache:pool:prune` (daily cron, docs/REPERTOIRE.md).
            repertoire.explorer_cache:
                adapter: app.cache.adapter.repertoire_explorer

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
