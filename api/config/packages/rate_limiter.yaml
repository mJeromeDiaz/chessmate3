# Rate limiters for every auth endpoint that can be brute-forced or used to enumerate accounts.
# Each action is limited both by IP and by identifier (email, or the mfa_pending token), per OWASP's
# Authentication Cheat Sheet: an IP limit alone is defeated by a botnet or shared NAT, an identifier
# limit alone is defeated by rotating IPs. Storage is the default "cache.rate_limiter" pool, which
# resolves to the filesystem cache adapter here (no Redis in this project).
framework:
    rate_limiter:
        login_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        login_identifier:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        mfa_verify_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        mfa_verify_identifier:
            policy: sliding_window
            limit: 8
            interval: '15 minutes'
        # Wrong 2FA codes per account, across every login, resend and IP (App\Security\TwoFactor\MfaFailureLimiter).
        mfa_failure_account:
            policy: sliding_window
            limit: 20
            interval: '24 hours'
        mfa_resend_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        mfa_resend_identifier:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        register_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        register_identifier:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        forgot_password_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        forgot_password_identifier:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        verify_email_resend_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        verify_email_resend_identifier:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        refresh_ip:
            policy: sliding_window
            limit: 60
            interval: '15 minutes'
        refresh_identifier:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # Changing the password requires the current one, so a stolen access token could otherwise
        # be used to brute-force it. Identifier = the authenticated user's id.
        password_change_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        password_change_identifier:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # The reset token itself (40 random chars, HMAC-verified) is not guessable; this only caps
        # the cost of someone hammering the endpoint. Identifier = the token's selector.
        reset_password_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        reset_password_identifier:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Starting an OAuth flow writes a row (state + PKCE verifier); completing one calls the provider.
        oauth_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # Puzzles (identifier = user id). Generous for real play (a puzzle takes ~20 s at best), but
        # caps scripted farming of puzzles or of rating points.
        puzzle_attempt_start:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'
        puzzle_attempt_submit:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'
        # Each import calls the Lichess API.
        puzzle_lichess_import:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Woodpecker (identifier = user id). Creating a set scans the puzzle index and writes up to
        # 1,500 rows; playing is capped like rated puzzles.
        woodpecker_set_create:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        woodpecker_attempt_start:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'
        woodpecker_attempt_submit:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'
        # Timed runs (identifier = user id). Starting one writes a row and opens a round; items
        # are capped higher than untimed play: light runs are about speed (a puzzle every ~2 s).
        training_run_start:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        training_session_start:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        training_plan_write:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
        # Calendar address (identifier = user id): regenerating or revoking it.
        training_calendar_write:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Calendar feed (identifier = the token's hash): apps poll it every few minutes to hours.
        training_calendar_feed:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
        notification_push:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
        training_item_next:
            policy: sliding_window
            limit: 600
            interval: '10 minutes'
        training_item_submit:
            policy: sliding_window
            limit: 600
            interval: '10 minutes'
        # Repertoires (identifier = user id). Building one move by move is a request per move:
        # generous, but caps scripted writes (every change rewrites derived data of the graph).
        repertoire_create:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        repertoire_edit:
            policy: sliding_window
            limit: 600
            interval: '10 minutes'
        # Repertoire imports (PGN analysed and stored for a day; studies read from Lichess).
        repertoire_import:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Lichess proxy (explorer and cloud eval together). The front waits 300 ms of stillness
        # before asking and caches per position; answers are cached server-side for everyone.
        repertoire_explorer:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'

        # Early access (identifier = the admin's id): invitation keys created or resent, each one an email.
        early_access_invitation_write:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        # Admin dashboard reads (identifier = the admin's id): statistics and the player list.
        admin_read:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'
        # Admin actions on players (identifier = the admin's id): suspensions and their lifting.
        admin_write:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
        # Invitation link checked by the sign-up page (public, by IP). Keys can't be guessed: this
        # only caps the cost of someone hammering the endpoint.
        invitation_check_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # Waiting-list requests (public, nothing emailed): per IP, and overall (identifier "all") so
        # that a botnet can't flood the table the admins read.
        access_request_ip:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        access_request_global:
            policy: sliding_window
            limit: 300
            interval: '1 day'

        # Dashboard reads (identifier = user id): the page asks for 2 or 3 of them per display.
        dashboard_read:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'

        # Profile (identifier = user id): saving the name/handle/avatar or the preferences, and checking a handle while
        # typing (debounced by the SPA). The check only tells whether a public handle is taken.
        profile_write:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # Account deletion (identifier = user id): codes sent by email, and confirmations tried (each code
        # also allows 5 attempts; this caps the guesses across codes).
        # Data export (identifier = user id): a ZIP of every exercise, built on each request.
        profile_export:
            policy: sliding_window
            limit: 3
            interval: '24 hours'
        account_deletion_code:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        account_deletion_confirm:
            policy: sliding_window
            limit: 15
            interval: '1 hour'
        profile_handle_check:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'

# End-to-end tests (front/tests/e2e): every test signs in from 127.0.0.1 and each page load
# refreshes the session, so a full run (and a rerun) exceeds the per-IP refresh budget. The
# per-identifier limit (one token family per seeded user) stays as in production.
when@e2e:
    framework:
        rate_limiter:
            refresh_ip:
                policy: sliding_window
                limit: 100000
                interval: '15 minutes'
            # Every waiting-list request of a run (and of reruns) comes from 127.0.0.1 too.
            access_request_ip:
                policy: sliding_window
                limit: 100000
                interval: '1 hour'
