# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Identifies the application to Lichess (their API asks for a meaningful User-Agent).
    app.lichess.user_agent: 'DontStayRooky/1.0 (opening repertoire trainer; +https://github.com/mJeromeDiaz)'
    # Smallest Woodpecker set (docs/WOODPECKER.md); lowered in tests to finish a cycle quickly.
    woodpecker.min_puzzles: 50
    # Light sets (docs/WOODPECKER.md): initial size, then a batch added whenever fewer than
    # "threshold" puzzles remain unseen in the round, up to a strict maximum.
    woodpecker.light.initial_puzzles: 100
    woodpecker.light.growth_batch: 20
    woodpecker.light.growth_threshold: 5
    woodpecker.light.max_puzzles: 1500
    # Web Push (docs/NOTIFICATIONS.md): the only hosts the server POSTs notifications to (the
    # browsers' push services). A leading dot allows the subdomains.
    notification.push.allowed_hosts:
        - 'fcm.googleapis.com'
        - 'android.googleapis.com'
        - 'updates.push.services.mozilla.com'
        - '.push.apple.com'
        - '.notify.windows.com'

# Tests and e2e run on ~50 sample puzzles.
when@test:
    services:
        # No test ever reaches a push service: a mock by default (answers 200), replaced by tests
        # that check what is sent (tests/Functional/Notification/PushTestTrait.php).
        push.client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true
        # The request traces of the last request (config/packages/monolog.yaml, when@test).
        app.trace.test_handler:
            class: Monolog\Handler\TestHandler
            public: true
        # Built by hand in tests (other limits), or used by one service only and inlined otherwise.
        App\Repertoire\RepertoireManager: { autowire: true, public: true }
        App\Repertoire\Graph\GraphEditor: { autowire: true, public: true }
        App\Repertoire\Graph\GraphLoader: { autowire: true, public: true }
        App\Repertoire\Graph\GraphIndexer: { autowire: true, public: true }
        App\Repertoire\Graph\IndexWriter: { autowire: true, public: true }
        App\Repertoire\Graph\SegmentReconciler: { autowire: true, public: true }
        App\Repertoire\Graph\RowStore: { autowire: true, public: true }
        App\Repertoire\Graph\TrashBin: { autowire: true, public: true }
        App\Woodpecker\Set\OpeningSets: { autowire: true, public: true }
        App\Repertoire\Graph\RestorePlanner: { autowire: true, public: true }
        App\Notation\Games\LegendaryGames: { autowire: true, public: true }
        App\Repertoire\Transaction: { autowire: true, public: true }
        App\Repertoire\Opening\OpeningSynchronizer: { autowire: true, public: true }
        App\Repertoire\Import\ImportApplier: { autowire: true, public: true }
        App\Repertoire\Pgn\Exporter: { autowire: true, public: true }
        App\Repertoire\Srs\CardStore: { autowire: true, public: true }
        App\Repertoire\Srs\Reviewer: { autowire: true, public: true }
        App\Repertoire\Srs\DueQuery: { autowire: true, public: true }
        App\Repertoire\Import\Message\AnalyzeImportHandler: { autowire: true, autoconfigure: true, public: true }
        App\Repertoire\Import\Message\ApplyImportHandler: { autowire: true, autoconfigure: true, public: true }
        App\Ops\Queue\QueueDrainer: { autowire: true, public: true }
        App\Shop\Wallet\CrownAdjustment: { autowire: true, public: true }
        App\Shop\Reward\RewardRules: { autowire: true, public: true }
        # The daily chest, off unless a test switches it on (its random crystals in exact balances).
        App\Tests\Double\SwitchableStreakReward: { autowire: true }
        App\Gamification\Streak\StreakRewardInterface: '@App\Tests\Double\SwitchableStreakReward'
    parameters:
        woodpecker.min_puzzles: 5
        woodpecker.light.initial_puzzles: 10
        woodpecker.light.growth_batch: 5
        woodpecker.light.growth_threshold: 2
        woodpecker.light.max_puzzles: 30

when@e2e:
    parameters:
        woodpecker.min_puzzles: 5
        # As many as the default rating range holds among the sample puzzles (like a classic e2e set).
        woodpecker.light.initial_puzzles: 5
        woodpecker.light.growth_batch: 5
        woodpecker.light.growth_threshold: 2
        woodpecker.light.max_puzzles: 30

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Calendar feed tokens, kept encrypted to show the address again (docs/TRAINING.md, calendar),
    # with their own key: rotating one key never touches the other secrets.
    app.calendar.secret_box:
        class: App\Security\Crypto\SecretBox
        arguments:
            $base64Key: '%env(CALENDAR_TOKEN_KEY)%'
            $base64PreviousKey: '%env(default::CALENDAR_TOKEN_KEY_PREVIOUS)%'
            $keyName: 'CALENDAR_TOKEN_KEY'

    # Web Push requests to the browsers' push services: short timeout, no redirect followed (the
    # allowed hosts are checked before, App\Notification\Push\EndpointPolicy).
    push.client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['@http_client', 'withOptions']
        arguments: [{ timeout: 10, max_redirects: 0 }]

    # MySQL cache adapter of the repertoire.explorer_cache pool (config/packages/framework.yaml).
    app.cache.adapter.repertoire_explorer:
        parent: cache.adapter.doctrine_dbal
        arguments:
            index_0: '@doctrine.dbal.default_connection'
            index_3: { db_table: repertoire_explorer_cache }

    # The daily streak's freezes come from the store (docs/SHOP.md): Gamification owns the interface.
    App\Gamification\Streak\FreezeStockInterface: '@App\Shop\Freeze\FreezeStock'
    # And the day's chest (docs/SHOP.md, § 4 ter).
    App\Gamification\Streak\StreakRewardInterface: '@App\Shop\Reward\DailyRewarder'
    # The puzzle streak's helps and passes too: PuzzleStreak owns the interface.
    App\PuzzleStreak\Aid\AidStockInterface: '@App\Shop\Aid\AidStock'
    # The pardons of rated puzzles too: Puzzle owns the interface.
    App\Puzzle\Pardon\PardonStockInterface: '@App\Shop\Pardon\PuzzlePardons'
    # And those of blindfold puzzles and coordinates series: each domain owns its interface.
    App\Blindfold\Pardon\PardonStockInterface: '@App\Shop\Pardon\BlindfoldPardons'
    App\Coordinates\Pardon\PardonStockInterface: '@App\Shop\Pardon\CoordinatesPardons'
    # The crowns of a completed session come from the store (docs/SHOP.md, § 4 bis): Training owns the interface.
    App\Training\Session\SessionRewardInterface: '@App\Shop\Reward\SessionRewarder'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
